; Provisional software-development configuration.
; LOCKED: ESP32-DevKitC V4 / ESP32-WROOM-32E.
; esp32dev is a candidate board definition.
; Physical flash capacity and GPIO assignments remain unverified.
; No hardware upload or physical integration is authorized.

[env:esp32dev_espidf]
platform = espressif32@7.1.3
board = esp32dev
framework = espidf

; Opt-in continuous SIMULATION candidate; default self-test/Wokwi image retained.
[env:esp32dev_continuous]
extends = env:esp32dev_espidf
build_flags = -DVG_CONTINUOUS_SIMULATION=1
