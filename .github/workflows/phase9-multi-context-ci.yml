name: Phase 9 scoped host and Laravel CI
on:
  pull_request:
  workflow_dispatch:
jobs:
  firmware-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host build tools
        run: sudo apt-get update && sudo apt-get install -y gcc python3 php-cli
      - name: Run existing core tests
        run: python3 -B scripts/test_firmware_core_host.py
      - name: NET-001 host-only checks
        run: python3 -B scripts/test_phase9_net001_host_adapter.py
      - name: SYS-003 host-only checks
        run: python3 -B scripts/test_phase9_sys003_local_guard.py
      - name: Phase 9 Batch 2 host development contracts
        run: |
          python3 -B scripts/test_phase9_net002_offline_host.py
          python3 -B scripts/test_phase9_sys002_source_provenance.py
          python3 -B scripts/test_phase9_sys004_no_actuator.py
          python3 -B scripts/test_phase9_sec001_patterns.py
          python3 -B scripts/phase9_sec001_tracked_scan.py
          python3 -B scripts/test_phase9_tst001_scoped_evidence.py
          python3 -B scripts/phase9_tst001_scoped_evidence.py
      - name: Batch 3 five-context integrated host contracts
        run: |
          python3 -B scripts/test_phase9_b3_net001_uplink.py
          python3 -B scripts/test_phase9_b3_net002_replay.py
          python3 -B scripts/test_phase9_b3_sys002_provenance.py
          python3 -B scripts/test_phase9_b3_sys003_outage.py
          python3 -B scripts/test_phase9_b3_tel003_dedup.py
          python3 -B scripts/test_phase9_b3_integrated_host.py
      - name: Batch 4 telemetry and security host contracts
        run: |
          python3 -B scripts/test_phase9_b4_tel001.py
          python3 -B scripts/test_phase9_b4_tel002.py
          python3 -B scripts/test_phase9_b4_sec002.py
          python3 -B scripts/test_phase9_b4_tst001.py
          python3 -B scripts/test_phase9_b4_integrated.py
      - name: Batch 5 strict ingest, replay and dedup host contracts
        run: |
          python3 -B scripts/test_phase9_b5_api001_strict.py
          python3 -B scripts/test_phase9_b5_tel003_dedup.py
          python3 -B scripts/test_phase9_b5_net002_ack.py
          python3 -B scripts/test_phase9_b5_sec002_claims.py
          python3 -B scripts/test_phase9_b5_integrated.py
          python3 -B scripts/test_phase9_b5_tst001.py
      - name: Batch 6 host ingress and receipt contracts
        run: |
          python3 -B scripts/test_phase9_b6_tel001.py
          python3 -B scripts/test_phase9_b6_tel002.py
          python3 -B scripts/test_phase9_b6_api001.py
          python3 -B scripts/test_phase9_b6_net002.py
          python3 -B scripts/test_phase9_b6_tst001.py
          python3 -B scripts/test_phase9_b6_integrated.py
      - name: Batch 7 combined host safety and replay contracts
        run: |
          python3 -B scripts/test_phase9_b7_sys002.py
          python3 -B scripts/test_phase9_b7_sys003.py
          python3 -B scripts/test_phase9_b7_sys004.py
          python3 -B scripts/test_phase9_b7_net002.py
          python3 -B scripts/test_phase9_b7_tst001.py
          python3 -B scripts/test_phase9_b7_integrated.py
      - name: Batch 8 deterministic local alarm, ACK and synthetic ingress guards
        run: |
          python3 -B scripts/test_phase9_b8_sys003.py
          python3 -B scripts/test_phase9_b8_net002.py
          python3 -B scripts/test_phase9_b8_tel003.py
          python3 -B scripts/test_phase9_b8_sec002.py
          python3 -B scripts/test_phase9_b8_tst001.py
          python3 -B scripts/test_phase9_b8_integrated.py
      - name: UI source contract checks
        run: |
          python3 -B scripts/test_phase9_ui001_dashboard.py
          python3 -B scripts/test_phase9_ui002_views.py
          python3 -B scripts/test_phase9_tst002_ci_policy.py
  backend-mysql-isolated:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: vessel_gateway_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: vessel_gateway_ci
      DB_USERNAME: root
      DB_PASSWORD: ''
    defaults:
      run:
        working-directory: backend/laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --no-interaction
      - name: Batch 4 PHP standalone ingest fixture (no database)
        run: python3 -B ../../scripts/test_phase9_b4_api001.py
      - name: Prepare ephemeral Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force
      - name: Run Laravel tests on isolated MySQL
        run: php artisan test

  # B9 HTTP dispatch: no MySQL service/migrations; tests do not call DB.
  backend-http-no-db-b9:
    runs-on: ubuntu-24.04
    env:
      APP_ENV: testing
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '1'
      DB_DATABASE: vg_b9_not_available
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xmlwriter, pdo_mysql
          coverage: none
      - name: Install Laravel test dependencies (no DB)
        working-directory: backend/laravel
        run: composer install --no-progress --prefer-dist --no-interaction
      - name: Run B9 PHP ingress middleware probe
        run: python3 -B scripts/test_phase9_b9_http_probe.py
      - name: Run real B9 Laravel route/controller feature tests without DB
        working-directory: backend/laravel
        run: php artisan test --filter=Phase9B9HttpBoundaryTest
      - name: Verify B10 HTTP resilience in DB-free job
        run: |
          python3 -B scripts/test_phase9_b10_contract.py
          python3 -B scripts/test_phase9_b10_tst002.py
      - name: Run real B10 Laravel route/controller feature tests without DB
        working-directory: backend/laravel
        run: php artisan test --filter=Phase9B10HttpResilienceTest
      - name: Verify B11 typed outage response policy without DB
        run: |
          python3 -B scripts/test_phase9_b11_contract.py
          python3 -B scripts/test_phase9_b11_tst002.py
      - name: Run B11 Laravel HTTP dependency outage tests without DB
        working-directory: backend/laravel
        run: php artisan test --filter=Phase9B11DependencyUnavailableTest
      - name: Validate B12 no-store HTTP boundary source contract
        run: |
          python3 -B scripts/test_phase9_b12_http_boundary.py
          python3 -B scripts/test_phase9_b12_tst002.py
      - name: Run B12 Laravel device API no-store route coverage without DB
        working-directory: backend/laravel
        run: php artisan test --filter=Phase9B12CacheBoundaryTest
