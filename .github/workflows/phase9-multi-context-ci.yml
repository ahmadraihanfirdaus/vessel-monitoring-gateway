  backend-mysql-isolated:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: vessel_gateway_ci
        ports: ['127.0.0.1:3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: vessel_gateway_ci
      DB_USERNAME: root
      DB_PASSWORD: ''
      VG_MYSQL_TEST_ACK: vessel_gateway_ci
    defaults:
      run:
        working-directory: backend/laravel
    steps:
      - uses: actions/checkout@v4
      - name: Install C99 integration build tools
        run: sudo apt-get update && sudo apt-get install -y gcc python3
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2.35'
          extensions: pdo_mysql, mbstring, dom, xml, xmlwriter, openssl
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --no-interaction
      - name: Batch 4 PHP standalone ingest fixture (no database)
        run: python3 -B ../../scripts/test_phase9_b4_api001.py
      - name: Verify isolated runner failure behavior
        run: python3 -B ../../scripts/test_mysql_integration_gate.py
      - name: C99 through Laravel and real isolated MySQL with migration roundtrip
        # Guarded equivalent of php artisan migrate --force; no dotenv loading.
        run: python3 -B ../../scripts/run_mysql_integration.py --execute --migration-roundtrip
      - name: Real loopback TLS and persistent browser-session integration
        working-directory: .
        env:
          VG_PHP_CLI: php
        run: |
          python3 -B scripts/test_live_http_integration_gate.py
          python3 -B scripts/run_live_http_integration.py --php-binary php --execute

  # B9 HTTP dispatch: no MySQL service/migrations; tests do not call DB.
  backend-http-no-db-b9:
    runs-on: ubuntu-24.04
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '1'
      DB_DATABASE: vg_b9_not_available
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2.35'
          extensions: mbstring, dom, xmlwriter, pdo_mysql
          coverage: none
      - name: Install Laravel test dependencies (no DB)
        working-directory: backend/laravel
        run: composer install --no-progress --prefer-dist --no-interaction
      - name: Generate ephemeral test application key
        run: |
          python3 - <<'PY'
          import base64, os, secrets
          key = 'base64:' + base64.b64encode(secrets.token_bytes(32)).decode('ascii')
          print('::add-mask::' + key)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('APP_KEY=' + key + '\n')
          PY
      - name: Test MySQL isolation policy without any database
        working-directory: backend/laravel
        run: php vendor/bin/phpunit --testsuite Unit --do-not-cache-result
      - name: Run B9 PHP ingress middleware probe
        run: python3 -B scripts/test_phase9_b9_http_probe.py
      - name: Run real B9 Laravel route/controller feature tests without DB
        working-directory: backend/laravel
        run: php artisan test --filter=Phase9B9HttpBoundaryTest
      - name: Verify B10 HTTP resilience in DB-free job
        run: |
          python3 -B scripts/test_phase9_b10_contract.py
          python3 -B scripts/test_phase9_b10_tst002.py
      - name: Run real B10 Laravel route/controller feature tests without DB
        working-directory: backend/laravel
        run: php artisan test --filter=Phase9B10HttpResilienceTest
      - name: Verify B11 typed outage response policy without DB
        run: |
          python3 -B scripts/test_phase9_b11_contract.py
          python3 -B scripts/test_phase9_b11_tst002.py
      - name: Run B11 Laravel HTTP dependency outage tests without DB
        working-directory: backend/laravel
        run: php artisan test --filter=Phase9B11DependencyUnavailableTest
      - name: Validate B12 no-store HTTP boundary source contract
        run: |
          python3 -B scripts/test_phase9_b12_http_boundary.py
          python3 -B scripts/test_phase9_b12_tst002.py
      - name: Run B12 Laravel device API no-store route coverage without DB
        working-directory: backend/laravel
        run: php artisan test --filter=Phase9B12CacheBoundaryTest

      - name: Validate B13 cursor contract without DB
        run: |
          python3 -B scripts/test_phase9_b13_cursor_contract.py
          python3 -B scripts/test_phase9_b13_tst002.py
      - name: Run B13 Laravel device history cursor admission without DB
        working-directory: backend/laravel
        run: php artisan test --filter=Phase9B13CursorContractTest

      - name: Verify B14 cross-language bridge source contract
        run: |
          python3 -B scripts/test_phase9_b14_contract.py
          python3 -B scripts/test_phase9_b14_tst002.py
      - name: Emit real host C99 wire bytes without DB
        run: python3 -B scripts/phase9_b14_wire_bridge.py --output /tmp/vg-b14-wire.jsonl
      - name: Run B14 Laravel HTTP ingress with C99 wire bytes and mocks
        working-directory: backend/laravel
        env:
          VG_B14_WIRE_JSONL: /tmp/vg-b14-wire.jsonl
        run: php artisan test --filter=Phase9B14FirmwareWireHttpTest

      - name: Verify B15 journal-to-HTTP source contract
        run: |
          python3 -B scripts/test_phase9_b15_contract.py
          python3 -B scripts/test_phase9_b15_tst002.py
      - name: Emit host C99 volatile journal event wire without DB
        run: python3 -B scripts/phase9_b15_event_bridge.py --output /tmp/vg-b15-events.jsonl
      - name: B15 Laravel event HTTP admission with persistence mocks
        working-directory: backend/laravel
        env:
          VG_B15_EVENT_JSONL: /tmp/vg-b15-events.jsonl
        run: php artisan test --filter=Phase9B15JournalWireHttpTest

      - name: B16 C99 receipt ACK host fixture and source contract
        run: |
          python3 -B scripts/test_phase9_b16_contract.py
          python3 -B scripts/test_phase9_b16_receipt_gate.py
          python3 -B scripts/test_phase9_b16_tst002.py
      - name: B16 Laravel HTTP idempotent receipt contract without DB
        working-directory: backend/laravel
        env:
          VG_B14_WIRE_JSONL: /tmp/vg-b14-wire.jsonl
          VG_B15_EVENT_JSONL: /tmp/vg-b15-events.jsonl
        run: php artisan test --filter=Phase9B16ReceiptReplayTest

      - name: B17 validate host receipt source and reject tampered receipts
        run: |
          python3 -B scripts/test_phase9_b17_contract.py
          python3 -B scripts/test_phase9_b17_negative.py
      - name: B17 collect Laravel HTTP receipt evidence with no database
        working-directory: backend/laravel
        env:
          VG_B14_WIRE_JSONL: /tmp/vg-b14-wire.jsonl
          VG_B15_EVENT_JSONL: /tmp/vg-b15-events.jsonl
          VG_B17_RECEIPTS_JSONL: /tmp/vg-b17-receipts.jsonl
        run: php artisan test --filter=Phase9B17HttpReceiptExportTest
      - name: B17 reconcile actual HTTP receipts with bounded C99 ACK
        run: python3 -B scripts/phase9_b17_receipt_crosscheck.py --input /tmp/vg-b17-receipts.jsonl --evidence-dir /tmp

  firmware-esp32-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned local-build CLI
        run: python -m pip install platformio==6.2.0
      - name: Build fixed ESP32 image and verify one MiB app budget
        run: |
          python -B scripts/build_esp32_port.py --evidence-name esp32-transport-sdk-build-ci.txt
          python -B scripts/build_esp32_port.py --environment esp32dev_continuous --evidence-name esp32-transport-sdk-build-continuous-ci.txt
